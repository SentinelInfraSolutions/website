<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" role="img" aria-labelledby="title desc">
<title id="title">Sentinel Infrastructure Solutions shield</title>
<desc id="desc">A blue, silver, and dark shield containing a city skyline and circuit traces.</desc>
<defs>
  <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F8FAFC"/>
    <stop offset=".38" stop-color="#96A8BA"/>
    <stop offset=".55" stop-color="#0EA5E9"/>
    <stop offset="1" stop-color="#1E40AF"/>
  </linearGradient>
  <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#1A1F26"/>
    <stop offset="1" stop-color="#0D1117"/>
  </linearGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<path d="M120 8 222 46v81c0 68-41 119-102 145C59 246 18 195 18 127V46L120 8Z"
      fill="url(#shield)" stroke="url(#rim)" stroke-width="11"/>
<path d="M120 26 202 57v68c0 55-32 98-82 122-50-24-82-67-82-122V57l82-31Z"
      fill="none" stroke="#30445A" stroke-width="2"/>

<!-- City skyline -->
<g>
  <path d="M54 139V91h26v48Z" fill="#DCE5EF"/>
  <path d="M85 139V62h34v77Z" fill="#F8FAFC"/>
  <path d="M124 139V78h29v61Z" fill="#DCE5EF"/>
  <path d="M158 139V98h25v41Z" fill="#F8FAFC"/>
  <path d="M95 62V51h7v11m8 0V45h6v17" fill="none" stroke="#DCE5EF" stroke-width="4"/>
</g>

<!-- Windows -->
<g fill="#75899D">
  <path d="M61 99h5v7h-5zm9 0h5v7h-5zM61 113h5v7h-5zm9 0h5v7h-5zM61 127h5v7h-5zm9 0h5v7h-5z"/>
  <path d="M94 72h6v8h-6zm11 0h6v8h-6zM94 87h6v8h-6zm11 0h6v8h-6zM94 102h6v8h-6zm11 0h6v8h-6zM94 117h6v8h-6zm11 0h6v8h-6z"/>
  <path d="M132 87h5v7h-5zm10 0h5v7h-5zM132 101h5v7h-5zm10 0h5v7h-5zM132 115h5v7h-5zm10 0h5v7h-5z"/>
  <path d="M165 106h5v7h-5zm8 0h5v7h-5zM165 120h5v7h-5zm8 0h5v7h-5z"/>
</g>

<!-- Circuit network -->
<g fill="none" stroke="#0EA5E9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
  <path d="M53 157h29l16 16v42"/>
  <path d="M187 157h-29l-16 16v42"/>
  <path d="M75 187h24l21 21v29"/>
  <path d="M165 187h-24l-21 21"/>
  <path d="M120 146v42"/>
</g>
<g fill="#0EA5E9" filter="url(#glow)">
  <circle cx="53" cy="157" r="7"/><circle cx="187" cy="157" r="7"/>
  <circle cx="75" cy="187" r="7"/><circle cx="165" cy="187" r="7"/>
  <circle cx="98" cy="215" r="7"/><circle cx="142" cy="215" r="7"/>
  <circle cx="120" cy="146" r="7"/><circle cx="120" cy="237" r="7"/>
</g>
</svg>